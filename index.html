<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cultural Heritage Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cultural Heritage Map</h1>
    <p>Explore cultural places, traditions, stories, and historical sites.</p>
  </header>

  <main>
    <section class="controls">
      <label>
        Search
        <input id="searchInput" type="search" placeholder="Search by name or description">
      </label>

      <label>
        Type
        <select id="typeFilter">
          <option value="">All types</option>
        </select>
      </label>

      <label>
        Region
        <select id="regionFilter">
          <option value="">All regions</option>
        </select>
      </label>

      <button id="clearButton">Clear filters</button>
    </section>

    <div id="map"></div>

    <section>
      <h2>Locations</h2>
      <div id="results"></div>
    </section>
  </main>

  <footer>
    <p>Map data and cultural information should be credited to their contributors.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
